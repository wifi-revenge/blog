
name: Deploy to Github Pages

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Cache Hugo resources
              uses: actions/cache@v4
              env:
                  cache-name: cache-hugo-resources
              with:
                  path: resources
                  key: ${{ env.cache-name }}

            - uses: actions/setup-go@v5
              with:
                  go-version: "^1.17.0"

            - run: go version

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v2
              with:
                  hugo-version: "latest"
                  extended: true

            - name: Install Dart Sass
              run: |
                  DART_SASS_VERSION="1.108.2"
                  mkdir -p "${HOME}/.local"

                  curl -fsSL \
                    "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
                    -o "${RUNNER_TEMP}/dart-sass.tar.gz"

                  tar -xzf "${RUNNER_TEMP}/dart-sass.tar.gz" \
                    -C "${HOME}/.local"

                  chmod -R a+rX "${HOME}/.local/dart-sass"

                  echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

                  "${HOME}/.local/dart-sass/sass" --version

            - name: Build
              run: hugo --minify --gc

            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: public
                  clean: true
                  single-commit: true
